# My-devin Default Configuration

# LLM Settings
llm:
  # Provider: lm-studio, ollama, mlx
  provider: lm-studio

  # Default model to use
  default_model: qwen2.5-coder-32b-instruct

  # Model-specific settings
  models:
    qwen2.5-coder-32b-instruct:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 4096
      context_window: 32768

    qwen2.5-coder-14b-instruct:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 4096
      context_window: 32768

    deepseek-coder-v2-instruct:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 4096
      context_window: 16384

  # LM Studio settings (推奨)
  lm_studio:
    base_url: http://localhost:1234/v1
    api_key: "lm-studio"  # LM Studioではダミーキーを使用
    timeout: 300
    stream: true

  # Ollama-specific settings (オプション)
  ollama:
    base_url: http://localhost:11434
    timeout: 300

  # MLX-specific settings (macOS only, オプション)
  mlx:
    model_path: ~/.cache/mlx/models
    max_tokens: 4096

# API Server Settings
api:
  host: 0.0.0.0
  port: 8000
  workers: 4
  cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000

# Project Settings
project:
  workspace_dir: ./workspace
  max_file_size: 1048576  # 1MB
  ignored_patterns:
    - __pycache__
    - node_modules
    - .git
    - venv
    - .venv
    - dist
    - build
    - "*.pyc"
    - "*.log"

# Agent Settings
agent:
  max_iterations: 10
  timeout: 600  # 10 minutes
  retry_attempts: 3

# Code Generation Settings
code_generation:
  # Supported languages
  languages:
    - python
    - typescript
    - javascript
    - go
    - rust
    - java
    - cpp
    - c
    - ruby
    - php

  # Default templates directory
  templates_dir: ./config/prompts

  # Code quality checks
  quality_checks:
    enabled: true
    run_linters: true
    run_formatters: true

# Git Settings
git:
  auto_commit: false
  commit_message_template: |
    {summary}

    {details}

    Generated by My-devin
  default_branch: main

# Logging Settings
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: ./logs/my-devin.log
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Performance Settings
performance:
  # Batch size for processing multiple files
  batch_size: 10

  # Cache settings
  cache:
    enabled: true
    ttl: 3600  # 1 hour
    max_size: 1000

  # Memory limits (in MB)
  max_memory: 102400  # 100GB (for 512GB system)

# Security Settings
security:
  # Sandbox execution (for running generated code)
  sandbox_enabled: false

  # File access restrictions
  allowed_directories:
    - ./workspace
    - ./projects

  # Disallow certain operations
  disallowed_operations:
    - rm -rf /
    - sudo
    - chmod 777

# UI Settings
ui:
  theme: dark
  editor:
    font_size: 14
    tab_size: 2
    show_line_numbers: true
    word_wrap: true
